services:
  - type: web
    name: seat-arrangement
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
    autoDeploy: true
    plan: free
    healthCheckPath: /api/health