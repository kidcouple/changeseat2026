name: Keep Render and Supabase awake

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
    - cron: "0 12 * * *" # 매일 21:00 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping application health
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
        run: |
          set -euo pipefail
          url="${APP_HEALTH_URL:-https://seat-arrangement-ri4p.onrender.com/api/health}"
          ok=0
          for _ in 1 2 3 4 5 6; do
            if curl -fsS --max-time 90 "$url" | grep -q '"ok"'; then
              ok=1
              break
            fi
            sleep 20
          done
          if [ "$ok" -ne 1 ]; then
            echo "application health ping failed"
            exit 1
          fi

      - name: Ping Supabase database
        if: ${{ secrets.SUPABASE_DB_URL != '' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          python -m pip install --quiet "psycopg[binary]"
          python -c "import os; import psycopg; url=os.environ['SUPABASE_DB_URL'].replace('postgres://','postgresql://',1); conn=psycopg.connect(url, connect_timeout=20); cur=conn.cursor(); cur.execute('SELECT 1'); cur.fetchone(); conn.close(); print('supabase ping ok')"
